apiVersion: v1
kind: ConfigMap
metadata:
  name: safemeal-config
  namespace: safemeal
data:
  APP_ENV: production
  ENABLE_OIDC: "true"
  AGENT_CHECKPOINT_PATH: /app/data/runtime/agent_checkpoints.sqlite3
  KB_HYBRID_ENABLED: "true"
  KB_BM25_PATH: /app/data/runtime/knowledge_bm25.sqlite3
  INGESTION_QUEUE_URL: redis://redis.safemeal.svc.cluster.local:6379/1
