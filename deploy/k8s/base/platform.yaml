apiVersion: v1
kind: ServiceAccount
metadata:
  name: safemeal
  namespace: safemeal
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: safemeal-runtime
  namespace: safemeal
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: safemeal-uploads
  namespace: safemeal
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests: {storage: 20Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: safemeal-default-deny
  namespace: safemeal
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: safemeal-application
  namespace: safemeal
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [safemeal-api, safemeal-ingestion-worker]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to:
        - namespaceSelector: {}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 443}
