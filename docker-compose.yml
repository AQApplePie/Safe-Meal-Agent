name: safemeal

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: "safemeal-api:${SAFEMEAL_IMAGE_TAG:-local}"

x-database-environment: &database-environment
  DATABASE_URL: "${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}"

services:
  api:
    <<: *backend
    init: true
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *database-environment
      APP_ENV: "${APP_ENV_DOCKER:-production}"
      APP_NAME: SafeMeal Agent
      APP_VERSION: 0.1.2
      DEBUG: "${DEBUG:-false}"
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
      AUTH_MODE: "${AUTH_MODE_DOCKER:-trusted_gateway}"
      AUTH_GATEWAY_SECRET: "${AUTH_GATEWAY_SECRET:?AUTH_GATEWAY_SECRET is required}"
      REDIS_RATE_LIMIT_URL: redis://redis:6379/0
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      LLM_MODEL: "${LLM_MODEL:?LLM_MODEL is required}"
      LLM_FALLBACKS_JSON: '${LLM_FALLBACKS_JSON:-[]}'
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      LLM_CIRCUIT_FAILURE_THRESHOLD: "${LLM_CIRCUIT_FAILURE_THRESHOLD:-3}"
      LLM_CIRCUIT_RECOVERY_SECONDS: "${LLM_CIRCUIT_RECOVERY_SECONDS:-30}"
      LLM_REQUEST_TIMEOUT: "${LLM_REQUEST_TIMEOUT:-90}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-2}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:-2048}"
      MODEL_COST_CURRENCY: "${MODEL_COST_CURRENCY:-CNY}"
      MODEL_PRICING_JSON: '${MODEL_PRICING_JSON:-{}}'
      AGENT_HISTORY_SCAN_MESSAGES: "${AGENT_HISTORY_SCAN_MESSAGES:-40}"
      AGENT_CONTEXT_TOKEN_BUDGET: "${AGENT_CONTEXT_TOKEN_BUDGET:-6000}"
      AGENT_RESPONSE_TOKEN_RESERVE: "${AGENT_RESPONSE_TOKEN_RESERVE:-1200}"
      AGENT_MEMORY_RETRIEVAL_LIMIT: "${AGENT_MEMORY_RETRIEVAL_LIMIT:-20}"
      AGENT_MAX_TOOL_CALLS: "${AGENT_MAX_TOOL_CALLS:-12}"
      AGENT_MAX_MODEL_TOKENS: "${AGENT_MAX_MODEL_TOKENS:-20000}"
      AGENT_MAX_COST: "${AGENT_MAX_COST:-0}"
      AGENT_DISTRIBUTED_MAX_CONCURRENCY: "${AGENT_DISTRIBUTED_MAX_CONCURRENCY:-16}"
      AGENT_QUEUE_WAIT_TIMEOUT: "${AGENT_QUEUE_WAIT_TIMEOUT:-15}"
      AGENT_QUEUE_LEASE_SECONDS: "${AGENT_QUEUE_LEASE_SECONDS:-330}"
      ENABLE_AGENT_TRACE_PERSISTENCE: "${ENABLE_AGENT_TRACE_PERSISTENCE:-true}"
      AGENT_TRACE_PATH: /app/data/runtime/agent_traces.jsonl
      AGENT_TRACE_MAX_BYTES: "${AGENT_TRACE_MAX_BYTES:-50000000}"
      AGENT_TRACE_BACKUP_COUNT: "${AGENT_TRACE_BACKUP_COUNT:-5}"
      ENABLE_LLM: "${ENABLE_LLM:-true}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:?EMBEDDING_MODEL is required}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1024}"
      ENABLE_EMBEDDINGS: "${ENABLE_EMBEDDINGS:-false}"
      ENABLE_MILVUS: "${ENABLE_MILVUS:-false}"
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: "${MILVUS_COLLECTION:-recipes_current}"
      MILVUS_LEGACY_COLLECTION: "${MILVUS_LEGACY_COLLECTION:-recipes}"
      MILVUS_COLLECTION_TARGET: "${MILVUS_COLLECTION_TARGET:-recipes_v2}"
      MILVUS_LOAD_TIMEOUT: "${MILVUS_LOAD_TIMEOUT:-30}"
      KB_CHUNK_STRATEGY: "${KB_CHUNK_STRATEGY:-auto}"
      KB_SEMANTIC_BREAKPOINT_THRESHOLD: "${KB_SEMANTIC_BREAKPOINT_THRESHOLD:-0.55}"
      KB_SEMANTIC_MAX_SEGMENTS: "${KB_SEMANTIC_MAX_SEGMENTS:-256}"
      KB_DOCUMENT_CHUNK_STRATEGIES_JSON: '${KB_DOCUMENT_CHUNK_STRATEGIES_JSON:-}'
      TIKA_ENABLED: "${TIKA_ENABLED:-false}"
      TIKA_URL: "${TIKA_URL_DOCKER:-http://tika:9998}"
      TIKA_TIMEOUT: "${TIKA_TIMEOUT:-120}"
      TIKA_MAX_EXTRACTED_CHARS: "${TIKA_MAX_EXTRACTED_CHARS:-2000000}"
      SOURCE_LOCAL_ROOT: /app/uploads
      SOURCE_HTTP_ALLOWED_HOSTS: "${SOURCE_HTTP_ALLOWED_HOSTS:-}"
      SOURCE_S3_BUCKET: "${SOURCE_S3_BUCKET:-}"
      SOURCE_S3_PREFIX: "${SOURCE_S3_PREFIX:-}"
      SOURCE_S3_ENDPOINT_URL: "${SOURCE_S3_ENDPOINT_URL:-}"
      FEISHU_ACCESS_TOKEN: "${FEISHU_ACCESS_TOKEN:-}"
      SOURCE_SYNC_STATE_PATH: /app/data/sync/source_states.json
      SOURCE_SYNC_JOBS_JSON: '${SOURCE_SYNC_JOBS_JSON:-[]}'
      SOURCE_DELETE_MISSING: "${SOURCE_DELETE_MISSING:-true}"
      ENABLE_NEO4J: "${ENABLE_NEO4J:-true}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      NEO4J_CONNECTION_TIMEOUT: "${NEO4J_CONNECTION_TIMEOUT:-10}"
      ENABLE_LIGHTRAG: "${ENABLE_LIGHTRAG:-true}"
      LIGHTRAG_WORKING_DIR: /app/data/lightrag
      LIGHTRAG_RETRIEVAL_MODE: "${LIGHTRAG_RETRIEVAL_MODE:-hybrid}"
      LIGHTRAG_TOP_K: "${LIGHTRAG_TOP_K:-10}"
      LIGHTRAG_MAX_TOKEN_SIZE: "${LIGHTRAG_MAX_TOKEN_SIZE:-4096}"
      LIGHTRAG_OPERATION_TIMEOUT: "${LIGHTRAG_OPERATION_TIMEOUT:-120}"
    volumes:
      - ./uploads:/app/uploads
      - ./data/lightrag:/app/data/lightrag
      - ./data/sync:/app/data/sync
      - ./data/runtime:/app/data/runtime
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=8)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - safemeal-db-network
    restart: unless-stopped
    stop_grace_period: 30s

  db-migrate:
    <<: *backend
    command: ["python", "-m", "back.infrastructure.persistence.migration_gate", "upgrade"]
    environment:
      <<: *database-environment
      APP_ENV: "${APP_ENV_DOCKER:-production}"
      DEBUG: "false"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
      AUTH_MODE: "${AUTH_MODE_DOCKER:-trusted_gateway}"
      AUTH_GATEWAY_SECRET: "${AUTH_GATEWAY_SECRET:?AUTH_GATEWAY_SECRET is required}"
      ENABLE_LLM: "false"
      ENABLE_EMBEDDINGS: "false"
      ENABLE_MILVUS: "false"
      ENABLE_NEO4J: "false"
      ENABLE_LIGHTRAG: "false"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - safemeal-db-network
    restart: "no"

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-recipe_db}"
      MYSQL_USER: "${MYSQL_USER:-recipe_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql/init_mysql.sql:/docker-entrypoint-initdb.d/00_recipe_schema.sql:ro
      - ./data/mysql/insert_sample_data.sql:/docker-entrypoint-initdb.d/10_recipe_seed.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - safemeal-db-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - safemeal-db-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: safemeal-neo4j
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-17474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-17687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-none}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$$NEO4J_AUTH" = "none" ]; then
            cypher-shell -a bolt://127.0.0.1:7687 'RETURN 1' >/dev/null 2>&1;
          else
            user="$${NEO4J_AUTH%%/*}"; password="$${NEO4J_AUTH#*/}";
            cypher-shell -a bolt://127.0.0.1:7687 -u "$$user" -p "$$password" 'RETURN 1' >/dev/null 2>&1;
          fi
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    networks:
      - safemeal-db-network
    restart: unless-stopped

  etcd:
    profiles: ["retrieval"]
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    networks:
      - safemeal-db-network
    restart: unless-stopped

  minio:
    profiles: ["retrieval"]
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - safemeal-db-network
    restart: unless-stopped

  milvus:
    profiles: ["retrieval"]
    image: milvusdb/milvus:v2.4.23
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-}"
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_HOST_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_HOST_PORT:-9091}:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - safemeal-db-network
    restart: unless-stopped

  tika:
    profiles: ["ingestion"]
    image: apache/tika:3.3.1.0-full
    ports:
      - "${TIKA_HOST_PORT:-9998}:9998"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9998/version >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - safemeal-db-network
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/agent-alerts.yml:/etc/prometheus/agent-alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    networks:
      - safemeal-db-network
    restart: unless-stopped

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-19093}:9093"
    depends_on:
      alert-receiver:
        condition: service_healthy
    networks:
      - safemeal-db-network
    restart: unless-stopped

  alert-receiver:
    profiles: ["monitoring"]
    <<: *backend
    command: ["uvicorn", "back.infrastructure.operations.alert_receiver:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      ALERT_INBOX_PATH: /app/data/runtime/alerts.jsonl
      ALERT_NOTIFICATION_WEBHOOK_URL: "${ALERT_NOTIFICATION_WEBHOOK_URL:-}"
      ALERT_NOTIFICATION_WEBHOOK_TOKEN: "${ALERT_NOTIFICATION_WEBHOOK_TOKEN:-}"
    volumes:
      - ./data/runtime:/app/data/runtime
    ports:
      - "127.0.0.1:${ALERT_RECEIVER_HOST_PORT:-18090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - safemeal-db-network
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-safemeal-local}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-13000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - safemeal-db-network
    restart: unless-stopped

networks:
  safemeal-db-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
