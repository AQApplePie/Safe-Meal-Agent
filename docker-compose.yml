name: safemeal

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: "safemeal-api:${SAFEMEAL_IMAGE_TAG:-local}"

services:
  api:
    <<: *backend
    init: true
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: "${DATABASE_URL_DOCKER:-mysql+pymysql://recipe_user:safemeal-local@mysql:3306/recipe_db}"
      API_KEY: "${API_KEY:-safemeal-local-api-key}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      REDIS_RATE_LIMIT_URL: redis://redis:6379/0
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      LLM_MODEL: "${LLM_MODEL:-qwen3-max}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-v4}"
      ENABLE_LLM: "${ENABLE_LLM:-true}"
      ENABLE_EMBEDDINGS: "${ENABLE_EMBEDDINGS:-true}"
      ENABLE_MILVUS: "${ENABLE_MILVUS:-true}"
      MILVUS_HOST: retrieval
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: "${MILVUS_COLLECTION:-recipes_current}"
      ENABLE_NEO4J: "${ENABLE_NEO4J:-true}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-safemeal-local-neo4j}"
      AGENT_TRACE_PATH: /app/data/runtime/agent_traces.jsonl
    volumes:
      - ./uploads:/app/uploads
      - ./data/runtime:/app/data/runtime
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db-migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "${DATABASE_URL_DOCKER:-mysql+pymysql://recipe_user:safemeal-local@mysql:3306/recipe_db}"
      ENABLE_LLM: "false"
      ENABLE_EMBEDDINGS: "false"
      ENABLE_MILVUS: "false"
      ENABLE_NEO4J: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-safemeal-local-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-recipe_db}"
      MYSQL_USER: "${MYSQL_USER:-recipe_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-safemeal-local}"
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql/init_mysql.sql:/docker-entrypoint-initdb.d/00_recipe_schema.sql:ro
      - ./data/mysql/insert_sample_data.sql:/docker-entrypoint-initdb.d/10_recipe_seed.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-17474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-17687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/safemeal-local-neo4j}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p '${NEO4J_PASSWORD:-safemeal-local-neo4j}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: ["etcd", "--advertise-client-urls=http://127.0.0.1:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-safemealminio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-safemeal-local-minio}"
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.23
    command: ["retrieval", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-safemealminio}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-safemeal-local-minio}"
    volumes:
      - milvus_data:/var/lib/retrieval
    ports:
      - "${MILVUS_HOST_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_HOST_PORT:-19091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  neo4j_data:
  etcd_data:
  minio_data:
  milvus_data:
