[project]
name = "safemeal"
version = "0.1.2"
description = "面向菜谱领域的垂类多工具 Agent 系统"
authors = [
    {name = "SafeMeal Agent Maintainers"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["safemeal/infrastructure/persistence/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires local infrastructure or Docker",
    "testcontainers: starts disposable Docker containers",
    "rag: retrieval quality and fusion tests",
    "graph: LangGraph orchestration and checkpoint tests",
    "regression: frozen Agent benchmark regression gate",
]
